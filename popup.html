<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Fill</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Main Panel ── -->
  <div id="panelMain">
    <div class="header">
      <div class="logo">
        <img src="icons/icon16.png" alt="" />
        <span>Quick Fill</span>
      </div>
      <div class="header-actions">
        <button class="btn-clear" id="btnClear"></button>
        <button class="btn-icon" id="btnSettings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="limit-banner" id="limitBanner" style="display:none">
      <span id="limitBannerText"></span>
      <button class="btn-upgrade" id="btnUpgradeMain"></button>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" class="search-input" autocomplete="off" />
      <button class="btn-save-input" id="btnSaveInput"></button>
    </div>

    <div class="list-wrap" id="listWrap">
      <div class="empty" id="emptyTip"></div>
    </div>

    <div class="footer">
      <span id="countTip" class="count-tip"></span>
      <span class="shortcut-tip" id="shortcutTip"></span>
    </div>
  </div>

  <!-- ── Settings Panel ── -->
  <div id="panelSettings" style="display:none">
    <div class="header">
      <button class="btn-back" id="btnBack">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <span class="settings-title" id="settingsTitle"></span>
      <div style="width:28px"></div>
    </div>

    <div class="settings-body">

      <div class="settings-section-label" id="labelAccount"></div>

      <div id="authForm">
        <div class="auth-tabs">
          <button class="auth-tab auth-tab--active" id="tabLogin"></button>
          <button class="auth-tab" id="tabRegister"></button>
        </div>
        <div class="auth-fields">
          <input type="email" id="authEmail" class="search-input" autocomplete="off" />
          <input type="password" id="authPassword" class="search-input" />
          <div id="authError" class="auth-error"></div>
          <button class="btn-auth" id="btnAuth"></button>
        </div>
      </div>

      <div id="userInfo" style="display:none">
        <div class="user-card">
          <div class="user-card-left">
            <div class="user-email" id="userEmail"></div>
            <div id="userBadge" class="user-badge"></div>
          </div>
          <button class="btn-logout" id="btnLogout"></button>
        </div>
        <div id="upgradeSection" style="display:none">
          <div class="upgrade-hint" id="upgradeHint"></div>
          <button class="btn-upgrade-full" id="btnUpgradeSettings"></button>
        </div>
      </div>

      <div class="settings-divider"></div>

      <div class="settings-section-label" id="labelSites"></div>

      <div class="site-mode-bar">
        <label class="radio-label">
          <input type="radio" name="siteMode" value="all" id="modeAll" />
          <span id="labelModeAll"></span>
        </label>
        <label class="radio-label">
          <input type="radio" name="siteMode" value="allowlist" id="modeAllowlist" />
          <span id="labelModeAllowlist"></span>
        </label>
      </div>

      <div id="allowlistSection">
        <div class="site-add-wrap">
          <input type="text" id="siteInput" class="search-input" autocomplete="off" />
          <button class="btn-save-input" id="btnAddSite"></button>
        </div>
        <button class="btn-add-current" id="btnAddCurrent"></button>
        <div class="list-wrap site-list-wrap" id="siteListWrap">
          <div class="empty" id="siteEmptyTip"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
